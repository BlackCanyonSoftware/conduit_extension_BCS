name: Release

# Publishes the unpacked-extension zip when a version tag is pushed: git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: The tag must match package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          test "v${version}" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} is not v${version}"; exit 1; }
      - run: npm run check
      - name: Package
        run: |
          node scripts/package-release.mjs
          node scripts/package-release.mjs --target firefox
      - name: Notes from the changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release/notes.md
          test -s release/notes.md || echo "See CHANGELOG.md." > release/notes.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            release/conduit-*.zip release/conduit-*.zip.sha256 \
            --title "Conduit ${GITHUB_REF_NAME#v}" \
            --notes-file release/notes.md
